name: Release

# Manual only. The version comes from the VERSION file, so cutting a release is
# "bump VERSION, commit, run this workflow".
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "::error file=VERSION::VERSION is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "Releasing v$version from ${GITHUB_SHA}"

      # snugswap.lua carries its own VERSION field; a mismatch means one of the
      # two was bumped and the other forgotten.
      - name: Check the library agrees with the VERSION file
        run: |
          version='${{ steps.version.outputs.version }}'
          in_lua="$(sed -n 's/.*VERSION *= *"\([^"]*\)".*/\1/p' snugswap.lua | head -1)"
          if [ "$in_lua" != "$version" ]; then
            echo "::error file=snugswap.lua::snugswap.lua says $in_lua but VERSION says $version"
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag has already been released -- bump VERSION first"
            exit 1
          fi

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Test
        run: make test LUA=lua5.4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' \
            --target "$GITHUB_SHA" \
            --title '${{ steps.version.outputs.tag }}' \
            --generate-notes \
            ${{ inputs.draft && '--draft' || '' }} \
            snugswap.lua
